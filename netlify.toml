# Sitio estático: Netlify publica la raíz del repositorio tal cual (sin build)
[build]
  publish = "."

# El service worker y el manifest no se guardan en caché del navegador,
# así cada deploy llega a los teléfonos
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Verificación de la app Android (TWA): sin esto el APK abre con barra de navegador
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

# APK de prueba para instalar en Android
[[headers]]
  for = "/descargas/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=pocket-vet.apk"
