<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pocket Vet</title>
  <meta name="description" content="Guía veterinaria de bolsillo: información verificada por veterinarios y la libreta de tu mascota.">
  <meta name="theme-color" content="#7FB8F0">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Ícono de la pestaña con esquinas redondeadas (los del manifest van cuadrados: el sistema los recorta) -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pocket Vet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <img src="icons/icon-192.png" alt="" class="logo">
      <h1 id="screen-title">Pocket Vet</h1>
      <span class="badge" id="offline-badge" hidden>Sin conexión</span>
      <div class="menu-idioma">
        <button type="button" class="btn-idioma" data-menu-idioma aria-haspopup="true" aria-expanded="false"><img src="icons/banderas/es.svg" alt="" width="26" height="18"></button>
        <div class="menu-lista" data-menu-lista hidden></div>
      </div>
    </header>

    <main id="screen" class="screen" tabindex="-1" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Navegación principal">
      <a href="#/inicio" data-tab="inicio"><span class="ico">🏠</span><span class="txt">Inicio</span></a>
      <a href="#/guias" data-tab="guias"><span class="ico">📖</span><span class="txt">Guías</span></a>
      <a href="#/libreta" data-tab="libreta"><span class="ico">🗒️</span><span class="txt">Libreta</span></a>
      <a href="#/perfil" data-tab="perfil"><span class="ico">🐾</span><span class="txt">Perfil</span></a>
    </nav>
  </div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
